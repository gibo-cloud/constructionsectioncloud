<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBPMA Website</title>
    
    <script>
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            window.location.replace("dashboard.html");
        }
    </script>
    
    <link rel="icon" href="logo.png" type="image/png">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Poppins', sans-serif; 
        }
        
        body { 
            background: linear-gradient(rgba(15, 23, 42, 0.5), rgba(15, 23, 42, 0.8)), url('3.png');
            background-size: cover;          
            background-position: center;     
            background-repeat: no-repeat;    
            background-attachment: fixed;
            height: 100vh; width: 100vw;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        .login-box {
            position: relative;
            z-index: 1;
            padding: 15px 40px 40px 40px; 
            border-radius: 24px; 
            width: 420px; 
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); 
            color: #ffffff;
            animation: slideUp 0.8s ease-out;
            overflow: hidden; 
        }

        .login-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent 70%, #f97316 80%, #ea580c 100%);
            animation: rotateLight 3s linear infinite;
            z-index: -2;
        }

        .login-box::after {
            content: '';
            position: absolute;
            inset: 2px; 
            background: rgba(15, 23, 42, 0.6); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border-radius: 22px; 
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.05);
            z-index: -1;
        }

        @keyframes rotateLight {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideUp { 
            0% { opacity: 0; transform: translateY(30px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }

        .main-logo {
            width: 400px; 
            max-width: 100%;
            height: auto;
            margin-top: 0;
            margin-bottom: 10px; 
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            border-radius: 12px; 
        }

        .input-group { 
            position: relative; margin-bottom: 20px; text-align: left; 
        }
        
        .input-group input {
            width: 100%; padding: 16px 45px 16px 20px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2); 
            background: rgba(0, 0, 0, 0.3);
            color: #ffffff; font-size: 15px; outline: none; transition: all 0.3s ease;
        }
        
        .input-group input::placeholder { color: #94a3b8; }

        .input-group input:focus { 
            border-color: #f97316; 
            background: rgba(0,0,0,0.5); 
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.3);
        }
        
        .input-group i.icon-right { 
            position: absolute; right: 18px; top: 50%; transform: translateY(-50%); 
            color: #cbd5e1; font-size: 20px; transition: 0.3s; 
        }
        
        .input-group input:focus ~ i.icon-right:not(.toggle-pass) { color: #f97316; }

        .input-group i.toggle-pass { cursor: pointer; }
        .input-group i.toggle-pass:hover { color: #ffffff; }

        .login-btn {
            width: 100%; 
            background: linear-gradient(135deg, #ea580c, #f97316); 
            color: white; border: none;
            padding: 16px; border-radius: 12px; font-size: 16px; cursor: pointer;
            transition: all 0.3s ease; font-weight: 600; letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(234, 88, 12, 0.3);
            margin-top: 10px;
        }
        
        .login-btn:hover { 
            background: linear-gradient(135deg, #c2410c, #ea580c); 
            box-shadow: 0 12px 25px rgba(234, 88, 12, 0.5); 
            transform: translateY(-3px); 
        }

        .login-btn:active { transform: translateY(1px); }
    </style>
</head>
<body>

    <div class="login-box">
        <img src="logo.png" alt="Main CBPMA Logo" class="main-logo">
        
        <form id="loginForm" autocomplete="off" onsubmit="event.preventDefault(); handleLogin();">
            <div class="input-group">
                <input type="text" id="loginUser" placeholder="Username" required autocomplete="new-password">
                <i class='bx bx-user icon-right'></i>
            </div>
            
            <div class="input-group">
                <input type="password" id="loginPass" placeholder="Password" required autocomplete="new-password">
                <i class='bx bx-hide icon-right toggle-pass' id="eyeIcon" onclick="togglePassword()"></i>
            </div>
            
            <button type="submit" id="loginBtn" class="login-btn">Sign In</button>
        </form>
    </div>

    <script>
        // Piliting i-clear ang text boxes tuwing naglo-load ang pahina
        window.onload = function() {
            setTimeout(function() {
                document.getElementById('loginUser').value = '';
                document.getElementById('loginPass').value = '';
            }, 50);
        };

        function togglePassword() {
            const passInput = document.getElementById('loginPass');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passInput.type === "password") {
                passInput.type = "text"; 
                eyeIcon.classList.replace('bx-hide', 'bx-show'); 
                eyeIcon.style.color = "#f97316"; 
            } else {
                passInput.type = "password"; 
                eyeIcon.classList.replace('bx-show', 'bx-hide'); 
                eyeIcon.style.color = "#cbd5e1"; 
            }
        }

        function handleLogin() {
            const userInput = document.getElementById('loginUser');
            const passInput = document.getElementById('loginPass');
            const user = userInput.value.trim();
            const pass = passInput.value.trim();
            const loginBox = document.querySelector('.login-box');

            if(user === "" || pass === "") {
                loginBox.style.animation = "none";
                setTimeout(() => { loginBox.style.animation = "slideUp 0.3s ease-out"; }, 10);
                
                alert("Pakiusap, ilagay ang iyong Username at Password.");
                return;
            }

            if (user === "Construction" && pass === "Dpwh2026") {
                userInput.value = "";
                passInput.value = "";

                sessionStorage.setItem('isLoggedIn', 'true');
                window.location.replace("dashboard.html");
            } else {
                loginBox.style.animation = "none";
                setTimeout(() => { loginBox.style.animation = "slideUp 0.3s ease-out"; }, 10);
                
                alert("Maling Username o Password. Pakisubukan muli.");
            }
        }
    </script>
</body>
</html>
